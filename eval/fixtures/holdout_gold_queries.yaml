# Out-of-sample validation set (2026-07-25) — NEVER looked at during Step 2's
# fix development (which was scored exclusively against strict_gold_queries.yaml).
# Purpose: check whether the four Step-2 gates (budget, set-not-single,
# attribute-contradiction, occasion-register) generalize to new query
# instances of the same classes, or whether they were overfit to the specific
# misses found while developing them.
#
# Same categories, same labeling rubric, same file-separation discipline as
# strict_gold_queries.yaml/strict_gold_labels.yaml — see that file's header
# for the full rubric. Scored via:
#   python scripts/eval_strict.py --mode pipeline --top-k 5 \
#     --queries-path eval/fixtures/holdout_gold_queries.yaml \
#     --labels-path eval/fixtures/holdout_gold_labels.yaml
#
# Deliberately targets the SAME fixed classes with NEW specific instances
# (new colour/budget/garment combos not seen during Step 2), not just random
# new queries — a fix that only works on the exact misses used to develop it
# is not actually fixed.
