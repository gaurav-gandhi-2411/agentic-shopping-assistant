# WAVE 9 -- gym/activewear occasion expansion (2026-07-23). One new first-class
# occasion slug ("gym") added to src/agents/outfit/occasions.py's OCCASIONS
# dict (formality=1, EITHER-lean) with keyword routing in
# src/agents/intent_parser.py's _OCCASION_MAP (gym/workout/"work out"/
# athleisure/"athletic wear"/yoga all resolve to "gym"). A NEW
# _ATHLETIC_REGISTER_OCCASIONS coherence gate (coherence.py gate 5) rejects
# ethnic/festive items from a gym look AND restricts the footwear slot to
# genuinely athletic-typed shoes only (slots.is_athletic_footwear_item) --
# see tests/test_gym_occasion.py for the full unit-level coverage this
# fixture set complements at the compose_outfit/retrieval level.
#
# Catalogue depth used to calibrate data_ceiling_tags below (pandas
# substring audit of data/processed/unified/catalogue.parquet's prod_name +
# product_type_name, 2026-07-23 -- NOTE this is broader than the narrow
# exact-facet counts normalizer.py writes, since e.g. most "track pants" are
# still classified under the generic "trousers" facet, not a dedicated one):
#   leggings            87 women /  12 men  (+20 unknown)
#   sports bra          31 women /   0 men
#   joggers            148 women /  50 men  (+6 unknown)
#   track pants         10 women / 541 men
#   cargo pants         62 women / 307 men  (+22 unknown)
#   gym/sport shorts    66 women /  83 men
#   skort               31 women /   0 men
#   athletic footwear   19 women /  87 men  (THIN for women -- several
#                                            entries below are deliberate
#                                            honest-suppression probes, not
#                                            accidental gaps; the unbudgeted
#                                            case still finds ONE genuine
#                                            item ("Izzy 01 : Sneakers"), so
#                                            it is thin, not literally zero)
#
# Also documents real, PRE-EXISTING intent_parser.py gaps hit while writing
# these queries (out of scope to fix -- fixtures/tests only for this task):
#   - none of the new activewear catalogue facets (leggings, sports_bra,
#     joggers, track_pants, cargo_pants, skort) have a dedicated
#     _GARMENT_RULES entry. "leggings"/"joggers"/"skort" resolve
#     garment_type=null entirely (no rule matches them at all -- see
#     occasion_192/193/210 below); "track pants"/"cargo pants" fall through
#     to the generic "\bpants\b" rule and resolve garment_type="trousers",
#     losing the specific activewear facet. "sports bra" resolves via the
#     existing "\bbra\b" rule to garment_type="innerwear" (also not facet-
#     specific, but at least non-null). None of this affects `gates` (the
#     compose_outfit gates path never reads expected_intent.garment_type at
#     all -- see run_gates_stage in scripts/eval_model.py), only the
#     `relevance` block's precision measurement and any future garment-
#     specific hard-filtering.
#   - "sports bra for women" / "running shoes for women" (no "gym"/"workout"/
#     "yoga" keyword) resolve occasion=null, NOT "gym" -- a bare garment
#     mention alone carries no occasion signal. Every query below that is
#     meant to exercise the gym occasion deliberately includes an explicit
#     gym/workout/yoga cue for this reason.
# ---------------------------------------------------------------------------
