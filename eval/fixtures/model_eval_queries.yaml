# ---------------------------------------------------------------------------
# WAVE 8 — festival occasion expansion (2026-07-23). Five new first-class
# occasion slugs (diwali, navratri, karva_chauth, raksha_bandhan, eid) added
# to src/agents/outfit/occasions.py's OCCASIONS dict + matching keyword
# routing in src/agents/intent_parser.py's _OCCASION_MAP. Siblings of
# festive_puja/sangeet/haldi, not replacements — festive_puja still owns bare
# "puja"/"festive" free text (see tests/test_festival_occasions.py).
#
# Catalogue depth used to calibrate data_ceiling_tags below (pandas audit of
# data/processed/unified/catalogue.parquet, description/product-type keyword
# matches, 2026-07-23):
#   diwali          1344 women / 340 men  (good depth)
#   navratri/garba   333 women / 211 men  (moderate)
#   karva_chauth      24 women /   0 men  (THIN — several entries below are
#                                          deliberate honest-suppression
#                                          probes, not accidental gaps)
#   raksha_bandhan  1239 women / 135 men  (good apparel depth, BUT 635 of the
#                                          1239 "women" rows are actually
#                                          product_type_name="Rakhi" — the
#                                          thread/gift item itself, not
#                                          apparel. A bare "raksha bandhan
#                                          outfit" query risks these Rakhi-
#                                          typed rows surfacing for what is
#                                          clearly an APPAREL request. Flagged
#                                          honestly here as a real retrieval
#                                          risk, not fixed — code files were
#                                          out of scope for this fixture task.
#                                          No dedicated data_ceiling_tags
#                                          vocabulary word exists for this
#                                          confound (only womens_footwear/
#                                          mens_occasionwear/jewellery are
#                                          defined), so it is NOT tagged below
#                                          — recorded here instead.)
#   eid              178 women / 400 men  (men's depth good; women's thinner
#                                          — the INVERSE of most ethnic
#                                          occasions in this catalogue)
#
# Also documents two REAL, PRE-EXISTING parser gaps hit while writing these
# queries (both out of scope to fix — code files off-limits for this task):
#   - "sister" is not in _GENDER_MAP's explicit-women word list (only wife/
#     girlfriend/mum/mom/daughter/her/she/woman/etc. are) -> gender stays
#     null for "raksha bandhan outfit for sister" etc. See raksha_bandhan_001.
#   - "chaniya choli" is occasion-only vocabulary in _OCCASION_MAP, not a
#     recognised garment_type -> garment_type stays null even when it is the
#     literal garment being asked for. See navratri_002.
#
# A third issue was found in the ALREADY-EXISTING occasion_035 entry above
# (not modified here, out of this task's fixtures-only scope): now that
# "diwali" (6 chars) is a longer/higher-priority _OCCASION_MAP key than
# "puja" (4 chars), "diwali puja outfit under 6000" now resolves occasion=
# "diwali" instead of the "festive_puja" the fixture still asserts — a real
# regression introduced by the Wave 8 occasion-map addition. Flagged, not
# fixed (code files out of scope); avoided in every new query below by never
# combining a new occasion keyword with "puja"/"festive" in the same turn.
# ---------------------------------------------------------------------------

