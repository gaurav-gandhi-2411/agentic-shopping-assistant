# Coherence-judge calibration set — hand-scored ground truth, written BEFORE any
# judge (Ollama/Gemini/decomposed-prompt) ever sees these looks. This closes the
# gap the wave-measurement task flagged: scripts/eval_model.py's judge stage only
# had 4 synthetic anchors (JUDGE_CALIBRATION_ANCHORS, 2 good/2 bad) and no
# borderline cases, so a judge could pass calibration by learning "extreme
# scores only" without ever being tested on a middling look.
#
# PROVENANCE: hand-scored by Claude (Sonnet 5) reading each look's item list
# against the rubric below — same provenance model already accepted in this
# repo for eval/fixtures/strict_gold_labels.yaml ("Labeled by Claude... GG can
# overturn any label"). This is NOT real-stylist ground truth; it is a
# documented, auditable, reproducible substitute because no paid human-labeling
# budget exists for this wave. Any label here can be overturned on review —
# each entry states its rationale so a disagreement is easy to spot.
#
# ITEM SOURCING: items are real catalogue rows (data/processed/unified/
# catalogue.parquet — prod_name/colour_group_name/product_type_name/gender
# copied verbatim) wherever a suitable row existed at calibration-build time
# (2026-08-06). A few filler pieces (plain trousers, a generic dupatta/clutch,
# the men's necktie in bad_mixed_gender, the costume dress in bad_novelty) have
# no clean single-item catalogue match and are synthetic, matching the naming
# convention scripts/eval_model.py's original 4 anchors already used for 100%
# of their items. `source: real` / `source: synthetic` is tagged per item.
#
# RUBRIC (verbatim, matches JUDGE_SYSTEM_PROMPT / build_judge_prompt in
# scripts/eval_model.py so calibration is scoring the SAME question the judge
# is actually asked):
#   occasion_score (1-5): would a stylist say this outfit suits the stated
#     occasion's register/palette? 1 = completely wrong, 5 = excellent fit.
#     NOTE: per the prompt's own wording this axis folds in palette register,
#     not just "ethnic vs western" — a palette clash or a formality mismatch
#     drags this score down even when garment types are individually
#     occasion-plausible. This mirrors the convention the ORIGINAL bad_haldi_
#     velvet anchor already used (an internally matching all-black velvet look
#     still scores low on BOTH axes because it is wrong for the occasion).
#   coherence_score (1-5): do these items work together as one cohesive look
#     (colour, formality, style)? 1 = incoherent, 5 = well-styled.
#   gender_consistent / occasion_register_ok / formality_ok / palette_ok:
#     binary defect flags, one per failure class this fixture deliberately
#     probes. All true for a clean look; exactly one false for each BAD entry
#     (single, unambiguous defect per look, on purpose — makes failures
#     diagnosable instead of testing multiple confounded defects at once).
#
# BUCKETS:
#   good       — 6 looks, no defect, expect occasion_score>=4 AND
#                coherence_score>=4 (same bar as anchor_passes_calibration's
#                "good" bucket in scripts/eval_model.py).
#   bad        — 8 looks, exactly one clear defect each, expect
#                occasion_score<=2 AND coherence_score<=2 (same bar as
#                anchor_passes_calibration's "bad" bucket).
#   borderline — 6 looks, one SUBTLE issue each (arguable, not extreme).
#                Ground truth intentionally sits at occasion/coherence == 3
#                (a couple at 3/4) to test whether a candidate judge can avoid
#                collapsing to "everything not obviously broken = 5" — a judge
#                that scores every borderline case 5 has not actually learned
#                to evaluate coherence, it has learned to be lenient.
#
# eval/judge_calibration.py applies THE decision rule mechanically:
#   - every `good`/`bad` entry must fall in its expected bucket exactly
#     (same predicate as anchor_passes_calibration) for a candidate to ship.
#   - every `borderline` entry's score must land in {2,3,4} on both axes
#     (not at either pole 1 or 5) — plausibility, not exact-match.
