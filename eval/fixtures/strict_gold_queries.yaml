# ── kids-leak regression probes (added 2026-07-12) ────────────────────────────
# Live-proven P0 trust/safety bug: girls'/boys' items ranked into adult results
# for NON-occasion-keyword queries ("bridal" is not in intent_parser's
# _OCCASION_MAP, so the occasion-gated kids check that already existed never
# fired for these exact queries). category: literal — no occasion slug is
# extracted from either query today, so from the retrieval code's perspective
# there IS no occasion register in play; these exist specifically to close the
# gap that let real "Bitiya by Bhama GIRLS...", "Cutiekins Girls...",
# "BownBee Girls..." items rank above genuine adult bridal lehengas.
- id: kids_leak_001
  category: literal
  query: red lehenga bridal
  gender: women
- id: kids_leak_002
  category: literal
  query: gold jewellery to go with red lehenga
  gender: women
# ── reception/wedding_guest thin-allow-list regression probes (2026-07-30) ───
# Live-proven bug: the reception/wedding_guest "indo-western glam register"
# exception in coherence.py gate 3 required a literal "gown"/"blazer"/
# "trousers"/"shirt"/"suit"/"formal" substring in the item's own free-text
# name — catalogue audit showed only 258/1580 plain "Dress"-typed rows
# survived (16%) since almost none literally say "gown". Fixed by replacing
# the name-substring scan with a structured product_type facet-equality check
# (is_formal_capable_western_item) + casual-marker exclusion
# (is_casual_marker_item, extended). occ_reception_002 is the negative
# control: casual-marked trousers must still be rejected, not just "any
# trousers admitted by default" (that would be the over-widening failure
# mode the office-register gate hit before).
- id: occ_reception_001
  category: occasion
  query: black dress for a reception
  gender: women
- id: occ_reception_002
  category: occasion
  query: navy blue blazer for a wedding reception
  gender: men
# ── bridal occasion-mapping + merchandise-gate regression probes (2026-07-30)
# Live-proven bug: "bridal" was never in intent_parser._OCCASION_MAP, so
# occasion_slug resolved to None for any "bridal ..." query -- silently
# disabling EVERY occasion-gated protection (merchandise gate, loungewear
# gate, ethnic/western coherence gates), not just the specific gift-hamper
# leak that surfaced it ("Mortantra X Zivame Bridal Hamper Box C" ranking in
# top-5 for "bridal look for women"). Fixed by mapping "bridal" ->
# wedding_guest and adding bare "hamper"/"hampers" to
# _OCCASION_MERCHANDISE_TYPES. occ_bridal_002 is the negative control: an
# EXPLICIT hamper request must still return hampers, not be over-suppressed.
- id: occ_bridal_001
  category: occasion
  query: bridal look for women
  gender: women
- id: occ_bridal_002
  category: occasion
  query: bridal hamper
  gender: women
# ── classification-gap + brand-collision regression probes (2026-07-30) ──────
# occ_office_001/occ_festive_001: exercise the newly-classified footwear/
# outerwear/knitwear/coord/ethnic keyword coverage (classify_item/
# classify_anchor unknown-class fix, 8,021 -> 4,622 true-unknown rows).
# occ_brand_001: exercises the brand-name/ethnic-keyword collision fix
# (_BRAND_PREFIX_COLLISIONS) — "Jaipur Kurti" branded trousers must classify
# western, not ethnic, so they're honestly labeled MISS for a sangeet
# (ethnic_only) ask rather than silently masquerading as ethnic. Pool-
# underflow protection means the top-5 items are identical whether the fix
# is applied or not (no genuine ethnic "trousers" exist in this catalogue's
# sangeet-appropriate inventory) — this query locks in the CORRECT miss
# reason/register judgement, a genuine data-ceiling case, not a code gap.
- id: occ_office_001
  category: occasion
  query: office wear for women
  gender: women
- id: occ_festive_001
  category: occasion
  query: festive look for women
  gender: women
- id: occ_brand_001
  category: occasion
  query: jaipur kurti trousers for sangeet
  gender: women
