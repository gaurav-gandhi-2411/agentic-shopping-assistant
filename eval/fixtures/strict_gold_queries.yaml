# remapping "cocktail" -> "party_evening" (EITHER register, matches how
# "party"/"evening"/"date night" already resolve). occ_cocktail_003 is the
# reverse-direction probe: an EITHER register must still admit a genuinely
# ethnic/indo-western item for an Indian user who wants that for a cocktail
