# Recall-measurable query subset — bounded-universe queries only.
#
# WHY THIS EXISTS: scripts/eval_model.py's Stage 2 (R1) can only report
# recall_at_50 when a query's must-filter narrows the 112,425-item catalogue
# to <=100 candidate items (recall_at_k's own docstring: "recall against a
# several-thousand-item universe... is not meaningful"). Against the main
# 227-query fixture (eval/fixtures/model_eval_queries.yaml), only 3/227
# queries clear that bar (reports/model_eval_20260806T061125Z.md) because its
# `must` blocks only use product_type_contains + gender_in, which rarely
# narrows enough on their own. This fixture is a SEPARATE, purpose-built set
# of 28 queries whose `must` additionally constrains colour_in and price_max
# (new filter keys added to catalogue_universe_ids for this wave) — verified
# against the live data/processed/unified/catalogue.parquet to bound each
# query's universe to <=100 items before being added here.
#
# *** WHAT THIS DOES AND DOES NOT MEASURE — READ BEFORE CITING A NUMBER ***
# Every query here is LITERAL (plain garment type + gender + colour + budget,
# no occasion/style/silhouette nuance — see strict_gold_queries.yaml's
# category taxonomy). For a literal query, "relevant" and "satisfies the
# tight must-filter" are the SAME thing by construction: there is no hidden
# nuance a filter-satisfying item could still fail on. That is what makes
# recall computable here WITHOUT a second hand-labeling pass — but it also
# means recall@k on this fixture measures ONE narrow thing:
#
#       does retrieval find items matching a hard type+gender+colour+price
#       filter, not does it find items a shopper would actually want.
#
# It says NOTHING about recall on style-nuanced queries (bodycon vs maxi),
# occasion-register queries (haldi-appropriate vs merely "ethnic"), or any
# query a real user would phrase without stating an exact colour AND a price
# cap in the same breath — those remain UNMEASURED for recall, exactly as
# before this wave. Do not report this fixture's recall@k as "our recall" or
# "system recall" in any future summary — report it as "recall on the
# literal/tight-filter subset" every time, with this scope note attached.
#
# LABELING: none needed beyond the must-filter itself (see above) — this is
# the deliberate design choice over redoing strict-label-style manual
# relevance judgments on a harder query class.
version: 1
queries:
- id: recall_001
  category: literal
  query: black bodycon dress for women under ₹2000
  turns: ["black bodycon dress for women under 2000 rupees"]
  expected_intent: {gender: women}
  relevance: {must: {product_type_contains: [dress], gender_in: [women], colour_in: [black], price_max: 2000}}
