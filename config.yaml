catalogue:
  articles_csv: "data/hm/articles.csv"
  processed_dir: "data/processed"
  sample_num_items: 20000
  seed: 42

retrieval:
  dense_model: "sentence-transformers/all-MiniLM-L6-v2"
  dense_batch_size: 128
  dense_dim: 384
  bm25_tokenizer: "lower_alpha"
  rrf_k: 60
  top_k: 50
  final_k: 5
  # Store-diversity re-rank knob (MMR nudge).
  # 0.0 = pure relevance / current behaviour (safe default; exact same output as before).
  # Increase to spread results across stores for cross-store-eligible queries.
  # See src/retrieval/hybrid_search.py::store_diversity_rerank for formula details.
  # Sweep table confirmed 0.20 passes all gates (rel@10>=0.40, cov@10>=2.0, mono<=0.30).
  # Owner approved 0.20 (2026-06-14). Keep 0.0 to restore legacy pure-relevance behaviour.
  store_diversity: 0.20
  # Hard per-store cap on the candidate pool handed to the LLM reranker (applied
  # after store_diversity_rerank; backfills from the wider RRF pool when the cap
  # would otherwise shrink the pool below top_k). 0/None disables the cap.
  # See src/retrieval/hybrid_search.py::apply_per_store_cap. Phase A (2026-07-06).
  # TESTED raising 4->8 (2026-08-06) after the colour/price pushdown fix
  # (src/retrieval/hybrid_search.py) exposed per_store_cap=4 as the new binding
  # constraint on recall for single-store-dominated categories. Swept 4/8/16/off
  # on a niche (single-store-heavy, tight-filter) and a broad (generic) query
  # population — eval/per_store_cap_sweep.py, eval/per_store_cap_sweep_broad.py,
  # reports/per_store_cap_sweep_20260806.md:
  #   niche  recall@50: 4=0.438 8=0.522 16=0.615 off=0.713
  #   niche  maxshare@50 (top store's share of top-50): 4=0.19 8=0.27 16=0.40 off=0.53
  #   broad  P@5/P@10: flat ~0.930/0.900 at every cap value
  # The property-floor "literal P@5" proxy in that sweep read ~flat (0.721->0.714
  # at cap=8) but was too generous a read: rerunning the REAL hand-labeled strict
  # eval at cap=8 (scripts/eval_strict.py, all newly-surfaced items labeled, zero
  # unlabeled) showed strict P@5 0.874->0.866 (-0.8pp overall, -2.4pp on the
  # occasion category specifically) — a real, small, localized regression, not
  # noise. REVERTED to 4 (2026-08-06) rather than accept it: this project's
  # explicit gate is strict P@5 must not regress, and a bounded recall trade-off
  # is not this config's call to make unilaterally against that gate. The 2
  # single-store-dominated queries this exposed (white sneakers/women, black
  # footwear/women — both ~99-100% one store, campusshoes) remain a known,
  # understood, currently-unresolved recall gap; see reports/pushdown_fix_20260806.md.
  #
  # This value is now a FLOOR, not a fixed cap: HybridRetriever.search() runs it
  # through compute_adaptive_per_store_cap (src/retrieval/hybrid_search.py),
  # which loosens the effective cap per-query when the query's own qualifying
  # pool is itself store-concentrated (nothing genuine to diversify against —
  # the maroon-dupatta case above), and is a byte-identical no-op for the
  # multi-store queries this cap was designed for. Validated 2026-08-10: niche
  # recall@50 +3.1pp, broad-query P@5/P@10 unchanged, real strict P@5 +0.5pp
  # overall / +2.2pp on `occasion` (the category the earlier flat 4->8 raise
  # regressed) — reports/adaptive_per_store_cap_strict_eval_20260810T122542Z.md.
  per_store_cap: 4

llm:
  provider: "ollama"
  model: "llama3.1:8b"
  host: "http://localhost:11434"
  temperature: 0.2
  max_tokens: 400
  timeout_seconds: 60
  # Deprecated by Groq 2026-08-16 (console.groq.com/docs/deprecations); replaced
  # with their documented same-tier successor.
  groq_model: "openai/gpt-oss-20b"
  gemini_model: "gemini-2.5-flash"
  openrouter_model: "openai/gpt-oss-20b:free"

agent:
  max_iterations: 6
  enable_clarify_tool: true

router:
  provider: "llm"

memory:
  recent_turns: 6
  summary_trigger_turns: 12

api:
  host: "127.0.0.1"
  port: 8080
  cors_origins: ["http://localhost:8501"]

clip:
  model: "clip-ViT-B-32"
  batch_size: 64
  index_dir: "data/processed/clip"

features:
  image_input_enabled: true
