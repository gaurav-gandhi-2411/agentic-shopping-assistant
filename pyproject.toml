[project]
name = "agentic-shopping-assistant"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "sentence-transformers>=3.0.0",
    "colour-science>=0.4.4",
    "rank-bm25>=0.2.2",
    "faiss-cpu>=1.15.0",
    "pandas>=2.2.0",
    "numpy>=2.4.6",
    "pyarrow>=15.0.0",
    "tqdm>=4.70.0",
    "pyyaml>=6.0.3",
    "langgraph>=1.2.11",
    "langchain-core>=1.5.4",
    "langchain-ollama>=0.2.0",
    "ollama>=0.6.2",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
    "pydantic>=2.8.0",
    "websockets>=12.0",
    "streamlit>=1.61.1",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "groq>=1.6.0",
    "google-genai>=1.0.0",
    "openai>=1.0.0",
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.1",
    "psycopg[binary]>=3.1.0",
    "pyjwt[crypto]>=2.8.0",
    "sentry-sdk[fastapi]>=2.68.0",
    "google-cloud-storage>=2.14.0",
    "pillow-heif>=1.5.0",
    "python-multipart>=0.0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_ollama: marks tests that require a running Ollama instance (deselect with -m 'not requires_ollama')",
    "requires_index: marks tests that require pre-built retrieval index files (deselect with -m 'not requires_index')",
    "requires_clip: marks tests that load the real CLIP model and require network/model download (deselect with -m 'not requires_clip')",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = false
