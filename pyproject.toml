[project]
name = "agentic-shopping-assistant"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "sentence-transformers>=3.0.0",
    "colour-science>=0.4.4",
    "rank-bm25>=0.2.2",
    "faiss-cpu>=1.15.1",
    "pandas>=2.2.0",
    "numpy>=2.4.6",
    "pyarrow>=25.0.1",
    "tqdm>=4.70.1",
    "pyyaml>=6.0.3",
    "langgraph>=1.2.20",
    "langchain-core>=1.7.6",
    "langchain-ollama>=1.1.0",
    "ollama>=0.6.3",
    "fastapi>=0.162.2",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.3",
    "websockets>=12.0",
    "streamlit>=1.67.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.2.4",
    "groq>=1.7.0",
    "openai>=1.0.0",
    "sqlalchemy>=2.1.8",
    "alembic>=1.20.1",
    "psycopg[binary]>=3.3.8",
    "pyjwt[crypto]>=2.8.0",
    "sentry-sdk[fastapi]>=2.74.0",
    "google-cloud-storage>=2.14.0",
    "pillow-heif>=1.8.1",
    "python-multipart>=0.0.33",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_ollama: marks tests that require a running Ollama instance (deselect with -m 'not requires_ollama')",
    "requires_index: marks tests that require pre-built retrieval index files (deselect with -m 'not requires_index')",
    "requires_clip: marks tests that load the real CLIP model and require network/model download (deselect with -m 'not requires_clip')",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = false
# Without these, `mypy .` aborted ("Source file found twice under different module names:
# eval_harness and scripts.eval_harness") before checking anything: scripts/ has no
# __init__.py yet is imported as `scripts.*`. explicit_package_bases resolves module names
# from the repo root so both spellings agree.
explicit_package_bases = true
mypy_path = "."
# Production + operational code. tests/ is excluded for now (439 errors at introduction,
# mostly fixture/mock typing); frontend, data and caches are not Python we ship.
files = ["src", "api", "eval", "qa", "alembic", "spaces", "scripts"]
