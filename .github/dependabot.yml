version: 2
updates:
  # Python — repo root (pip: no uv.lock present, requirements.txt-based)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    assignees:
      - gaurav-gandhi-2411
    labels:
      - dependencies

  # Node — frontend
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    # @types/node is pinned to ^24 to match the Vercel (Node 24.x) and CI runtime; bump the
    # major only when that runtime moves. Minor/patch updates are still proposed.
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # @supabase/ssr is 0.x, where a MINOR bump is a breaking change, and it sits on the auth
      # path (cookie/session handling for magic-link sign-in). Patch updates are still proposed.
      # To update deliberately: bump it by hand on a branch, open a Vercel preview, and complete
      # a real magic-link sign-in (email link -> callback -> signed-in session -> refresh the
      # page and confirm it persists) before merging. See DEPLOY.md "0.x-minor-is-breaking".
      - dependency-name: "@supabase/ssr"
        update-types:
          - version-update:semver-minor
    assignees:
      - gaurav-gandhi-2411
    labels:
      - dependencies

  # GitHub Actions — keep action versions current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    assignees:
      - gaurav-gandhi-2411
    labels:
      - dependencies
