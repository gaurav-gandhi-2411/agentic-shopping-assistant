version: 2
updates:
  # Python — repo root (pip: no uv.lock present, requirements.txt-based)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    assignees:
      - gaurav-gandhi-2411
    labels:
      - dependencies

  # Node — frontend
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    assignees:
      - gaurav-gandhi-2411
    labels:
      - dependencies

  # GitHub Actions — keep action versions current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    assignees:
      - gaurav-gandhi-2411
    labels:
      - dependencies
