version: 2
updates:
  # Python — repo root (pip: no uv.lock present, requirements.txt-based)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    assignees:
      - gaurav-gandhi-2411
    labels:
      - dependencies

  # Node — frontend
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    # @types/node is pinned to ^24 to match the Vercel (Node 24.x) and CI runtime; bump the
    # major only when that runtime moves. Minor/patch updates are still proposed.
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    assignees:
      - gaurav-gandhi-2411
    labels:
      - dependencies

  # GitHub Actions — keep action versions current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    assignees:
      - gaurav-gandhi-2411
    labels:
      - dependencies
