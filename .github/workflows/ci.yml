name: CI

# WIF_PROVIDER / WIF_SERVICE_ACCOUNT corrected 2026-08-15 (Item 54): both
# secrets were last set 2026-07-12, before iconic-reactor-496423-m4 (the old
# GCP project) was deleted in the gandhi1129 sole-identity migration — the
# WIF pool they referenced no longer exists, so the auth step here was
# broken (confirmed via the identical failure on DealHunter's deploy
# pipeline: "invalid_target ... pool or provider is disabled or deleted").
# Repointed to a fresh github-pool/github-provider in stylemaitri-prod-260813
# and a new dedicated stylemaitri-ci-index-reader SA, scoped to
# roles/storage.objectViewer on gs://asa-demo-indices-stylemaitri-prod only
# (matches this step's own "read-only, index bucket only" label) — not the
# existing default compute SA, so this CI step can't touch anything beyond
# what it actually needs.
on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; only the jobs that do WIF auth add id-token: write.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for WIF auth (google-github-actions/auth)

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Install lint/type-check tools
        run: pip install ruff mypy==2.4.1
        # Neither is in requirements.txt (that's runtime deps only) — this step was
        # missing entirely, so "Lint (ruff)" has been hard-failing CI with
        # "ruff: command not found" since before this change; only ever worked
        # locally because dev machines have them installed globally.

      - name: Lint (ruff)
        run: ruff check .

      # Blocking ratchet: fails on any mypy error not in mypy-baseline.txt, and fails closed
      # if mypy crashes or checks nothing. `mypy .` previously aborted on a duplicate-module
      # error and was masked by continue-on-error, so it never type-checked anything.
      - name: Type-check (mypy ratchet)
        run: python scripts/mypy_ratchet.py

      # Fail-closed WIF gate. Dependabot-triggered and fork PR runs receive no repo
      # secrets and no id-token, so the GCP steps below cannot work there; those two
      # contexts (and only those) may skip them. In every other context (push to
      # master, PR from this repo's own branches, re-runs) a missing secret is a
      # HARD FAILURE, so a misconfiguration can never silently drop the
      # requires_index / eval coverage. Secrets can't be read in `if:`, so they are
      # mapped to env. PR author / head repo are used rather than github.actor, which
      # changes when a human re-runs a Dependabot run. Event values go via env, never
      # interpolated into the script body.
      - name: Check WIF availability (fail closed)
        id: wif
        env:
          WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          EVENT_NAME: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          if [ -n "$WIF_PROVIDER" ] && [ -n "$WIF_SERVICE_ACCOUNT" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ] && { [ "$PR_AUTHOR" = "dependabot[bot]" ] || [ "$PR_HEAD_REPO" != "$THIS_REPO" ]; }; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Index-dependent checks skipped::No WIF secrets (Dependabot/fork PR): requires_index tests were SKIPPED. This green run is NOT full coverage."
            {
              echo "### :warning: Reduced coverage (no secrets)"
              echo "requires_index tests were skipped for lack of secrets (Dependabot/fork PR). A green check here is not full coverage."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::WIF_PROVIDER / WIF_SERVICE_ACCOUNT missing in a context that must have them (event=$EVENT_NAME). Failing closed."
          exit 1

      - name: Authenticate to GCP (read-only, index bucket only)
        uses: google-github-actions/auth@v3
        if: steps.wif.outputs.available == 'true'
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        if: steps.wif.outputs.available == 'true'

      - name: Download unified index (for requires_index tests)
        if: steps.wif.outputs.available == 'true'
        run: |
          mkdir -p data/processed/unified data/processed/clip/unified
          gcloud storage cp -r 'gs://asa-demo-indices-stylemaitri-prod/unified/unified/*' data/processed/unified/
          gcloud storage cp gs://asa-demo-indices-stylemaitri-prod/unified/clip/unified/clip_article_ids.npy data/processed/clip/unified/
          # tests/test_retrieval.py, test_tools.py, and the conftest.py requires_index
          # sentinel (data/processed/dense.faiss) read the flat data/processed/ path,
          # not data/processed/unified/ — same index files, just also copied flat.
          cp data/processed/unified/* data/processed/

      - name: Test
        run: pytest -m "not requires_ollama" -v

      # Grounding smoke (#81): 10 prompts x REST+WS, mock LLM, stub agent over the committed
      # fixture catalogue. Offline: no index, no network, no LLM, no GCP. Exits 1 if any injected
      # ungrounded answer is missed or any grounded one is flagged. Lives in `backend` (not
      # `eval`) because `eval` steps are WIF-gated and skip on Dependabot/fork PRs, while this
      # needs no secrets and so is enforced on every run. The report goes to the runner temp
      # dir so the checkout stays clean.
      - name: Grounding smoke (mock LLM, offline)
        run: python -m evals.grounding.run --llm mock --agent stub --smoke --out-dir "${{ runner.temp }}/grounding-eval"

      - name: Validate advisory allow-list
        run: python scripts/check_advisory_allowlist.py check

      - name: Security audit (pip-audit)
        run: |
          pip-audit -r requirements.txt $(python scripts/check_advisory_allowlist.py pip-args)
          # No --ignore-vuln: the 4 transformers ignores that lived here were cleared by the
          # sentence-transformers 2.7 -> 5.7 / transformers 5.10.4 migration (2026-11-02), and
          # the newer advisories (PYSEC-2026-4164/-4240/-3929/-4174/-4146) by upgrades too.

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install allow-list checker dependency
        run: pip install pyyaml==6.0.3  # same pin as requirements.txt

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Lint
        run: cd frontend && npm run lint

      - name: Unit tests (vitest)
        run: cd frontend && npm test

      - name: Build
        run: cd frontend && npm run build
        env:
          # Stub origins baked into this CI-only bundle (never deployed; Vercel builds its
          # own) so the e2e step below can serve THIS build. Nothing listens on these
          # addresses: the e2e test intercepts every API request and mocks the WebSocket.
          NEXT_PUBLIC_BACKEND_URL: http://127.0.0.1:8099
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-anon-key

      # Wave 1b V2: one anonymous mobile (390x844) query end to end, backend stubbed, no live
      # LLM or production call. Chromium is installed per run and never committed.
      - name: Install Playwright browser
        run: cd frontend && npx playwright install --with-deps chromium

      - name: E2E (mobile landing, stubbed backend)
        run: cd frontend && npm run test:e2e

      - name: Security audit (npm audit)
        run: python scripts/check_advisory_allowlist.py npm-audit
        # Same high/critical threshold as the former `npm audit --audit-level=high`; the script
        # runs `npm audit --json` in frontend/ and only the allow-listed advisories (none today)
        # are filtered. Needs pyyaml (installed above).
        # BLOCKING (T2 gate — no continue-on-error). Threshold is high, not moderate:
        # the remaining findings (2026-11-02: 18 moderate, 0 high/critical) are the
        # eslint/@typescript-eslint/minimatch/glob dev-tooling chain, whose only fix
        # (`npm audit fix --force`) is a breaking major downgrade of eslint /
        # eslint-config-next / @sentry/nextjs. Re-evaluate when those majors move.

  eval:
    runs-on: ubuntu-latest
    needs: backend
    permissions:
      contents: read
      id-token: write   # required for WIF auth (google-github-actions/auth)

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Fail-closed WIF gate. Dependabot-triggered and fork PR runs receive no repo
      # secrets and no id-token, so the GCP steps below cannot work there; those two
      # contexts (and only those) may skip them. In every other context (push to
      # master, PR from this repo's own branches, re-runs) a missing secret is a
      # HARD FAILURE, so a misconfiguration can never silently drop the
      # requires_index / eval coverage. Secrets can't be read in `if:`, so they are
      # mapped to env. PR author / head repo are used rather than github.actor, which
      # changes when a human re-runs a Dependabot run. Event values go via env, never
      # interpolated into the script body.
      - name: Check WIF availability (fail closed)
        id: wif
        env:
          WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          EVENT_NAME: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          if [ -n "$WIF_PROVIDER" ] && [ -n "$WIF_SERVICE_ACCOUNT" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ] && { [ "$PR_AUTHOR" = "dependabot[bot]" ] || [ "$PR_HEAD_REPO" != "$THIS_REPO" ]; }; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Index-dependent checks skipped::No WIF secrets (Dependabot/fork PR): requires_index tests and the eval relevance gate were SKIPPED. This green run is NOT full coverage."
            {
              echo "### :warning: Reduced coverage (no secrets)"
              echo "requires_index tests and the eval relevance gate were skipped for lack of secrets (Dependabot/fork PR). A green check here is not full coverage."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::WIF_PROVIDER / WIF_SERVICE_ACCOUNT missing in a context that must have them (event=$EVENT_NAME). Failing closed."
          exit 1

      - name: Authenticate to GCP (read-only, index bucket only)
        uses: google-github-actions/auth@v3
        if: steps.wif.outputs.available == 'true'
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        if: steps.wif.outputs.available == 'true'

      - name: Download unified index
        if: steps.wif.outputs.available == 'true'
        run: |
          mkdir -p data/processed/unified
          gcloud storage cp -r 'gs://asa-demo-indices-stylemaitri-prod/unified/unified/*' data/processed/unified/

      - name: Relevance regression gate
        if: steps.wif.outputs.available == 'true'
        run: python scripts/eval_gate.py --max-unlabeled 3
        # Deterministic (zero LLM calls: intent/r1/gates) + hand-audited strict gold
        # eval — see scripts/eval_gate.py for thresholds. Replaces the old
        # `python -m eval.run --provider ollama` step, which needed Ollama (never
        # available in GitHub-hosted runners) and only ran with continue-on-error,
        # i.e. never actually gated anything.
        #
        # --max-unlabeled 3: the first real run on GitHub's Linux runner surfaced 2
        # borderline items (out of 246 scored) not seen on the Windows machine that
        # curated the gold labels — floating-point drift in similarity scoring across
        # CPU architectures, not a real regression (precision score itself unaffected
        # beyond noise). 3 is a small explicit tolerance (~1% of n), not a default —
        # scripts/eval_gate.py --max-unlabeled stays 0 for local pre-deploy runs, where
        # unlabeled items DO mean "re-audit the gold set."
