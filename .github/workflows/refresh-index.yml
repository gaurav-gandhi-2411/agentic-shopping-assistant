name: Refresh index

# Daily product-index refresh (Wave 1b V3(c)): fetch feeds -> build -> validate -> publish a NEW
# build to gs://asa-demo-indices-stylemaitri-prod/builds/<id>/ (create-only, never overwrites).
# Then, in separate jobs: preflight (the previous revision's pinned build must still exist) ->
# rollout (deploy.yml in index-rollout mode: same image, new revision pinned to the build, tag smoke,
# shift, post-shift check, automatic rollback) -> retain (customTime on old builds, only after a
# successful rollout). Any failed job opens/updates ONE prod-alert issue; prod is never left on a
# half-applied state (the rollback and template-pin restore live in deploy.yml).
#
# SAFE BY DEFAULT
#   * manual runs default to dry_run=true: everything runs except publish (the store is wrapped
#     read-only, nothing is uploaded, no rollout).
#   * the SCHEDULE only runs when the repo variable REFRESH_ENABLED is exactly 'true' (the pause
#     switch: set it to anything else, or delete it, to pause; no PR needed). Manual runs ignore it.
#   * runs only on refs/heads/master and only in this repo; the publisher's WIF provider enforces
#     the same condition independently (github-deploy-pool, repo + master).
#   * the build command comes from the repo variable REFRESH_BUILD_CMD (see the orchestrator's
#     docstring for the contract). Empty = the run fails with build_not_configured and publishes
#     nothing: there is no in-CI incremental builder in the repo yet.
#
# Identity: stylemaitri-index-publisher (custom role indexPublisher: objects create/get/list/update
# on the index bucket ONLY, no delete) through the same WIF provider as the deployer. The auth step
# sits after checkout and before the orchestrator; in a dry run the orchestrator wraps the store
# read-only, so the credential is only used to read the previous build's manifest.
#
# Failure -> exactly one `prod-alert` issue (opened, or commented on if already open); a later
# successful run closes it. A failed refresh changes nothing in prod.

on:
  schedule:
    - cron: "7 20 * * *"  # 20:07 UTC = 01:37 IST, off-peak and off the :00 pile-up
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: do everything except publish and rollout (nothing is uploaded)"
        required: false
        type: boolean
        default: true

# One refresh at a time. Never cancel a running one: a cancelled publish could strand a half build
# (harmless to serving, the manifest is uploaded last, but it wastes the day).
concurrency:
  group: refresh-index
  cancel-in-progress: false

# No default token permissions; each job grants itself exactly what it needs.
permissions: {}

env:
  GCP_PROJECT: stylemaitri-prod-260813
  BUCKET: asa-demo-indices-stylemaitri-prod
  # Not secrets (same provider path as in deploy.yml's header; an e-mail-shaped SA name).
  WIF_PROVIDER: projects/631709154646/locations/global/workloadIdentityPools/github-deploy-pool/providers/github-deploy-provider
  PUBLISHER_SA: stylemaitri-index-publisher@stylemaitri-prod-260813.iam.gserviceaccount.com
  DEPLOYER_SA: stylemaitri-deployer@stylemaitri-prod-260813.iam.gserviceaccount.com
  REGION: asia-south1
  SERVICE: asa-stylist-api

jobs:
  refresh:
    if: >-
      github.repository == 'gaurav-gandhi-2411/agentic-shopping-assistant' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'workflow_dispatch' || vars.REFRESH_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      id-token: write   # WIF auth as the publisher SA
    outputs:
      build_id: ${{ steps.run.outputs.build_id }}
      published: ${{ steps.run.outputs.published }}
      ok: ${{ steps.run.outputs.ok }}
      summary_b64: ${{ steps.run.outputs.summary_b64 }}  # small JSON (~6 KB) for the alert job
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Only what the orchestrator imports (versions pinned as in requirements.txt). The build
      # command installs its own heavier dependencies.
      - name: Install orchestrator dependencies
        run: |
          python -m pip install --quiet pydantic==2.13.5 pandas==2.2.3 numpy==2.4.6 \
            pyarrow==25.0.1 faiss-cpu==1.15.1 requests "google-cloud-storage>=2.14.0"

      - name: Authenticate to GCP (index publisher SA via github-deploy-pool)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.PUBLISHER_SA }}

      - name: Refresh (fetch, build, validate, publish unless dry run)
        id: run
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          BUILD_CMD: ${{ vars.REFRESH_BUILD_CMD }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          # The orchestrator's own exit code is the contract; capture it so the summary and
          # outputs are always written, then fail the step at the end.
          FLAGS=()
          if [ "$DRY_RUN" != "true" ]; then FLAGS+=(--publish); fi
          if [ -n "$BUILD_CMD" ]; then FLAGS+=(--build-cmd "$BUILD_CMD"); fi
          set +e
          python scripts/ops/refresh_index.py --work-dir "$RUNNER_TEMP/refresh" \
            --bucket "$BUCKET" --summary-out refresh-summary.json "${FLAGS[@]}"
          RC=$?
          set -e
          {
            echo "build_id=$(jq -r '.build_id // ""' refresh-summary.json 2>/dev/null || true)"
            echo "published=$(jq -r '.published // false' refresh-summary.json 2>/dev/null || echo false)"
            echo "ok=$(jq -r '.ok // false' refresh-summary.json 2>/dev/null || echo false)"
            echo "summary_b64=$(jq -c . refresh-summary.json 2>/dev/null | base64 -w0 || true)"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Index refresh (dry_run=${DRY_RUN})"
            echo '```json'
            jq '{ok, stage, exit_code, build_id, previous_build_id, published, failure, fresh_stores, refreshable_stores, total_items, count_delta_pct}' refresh-summary.json 2>/dev/null || echo '(no summary produced)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$RC"

  # The deployer identity can read Cloud Run but not the bucket; the publisher can read the bucket
  # but not Cloud Run. So the check "can the revision we would roll back to still load its build?"
  # reads Cloud Run as the deployer, then the bucket as the publisher (second auth step replaces the
  # first; UNVERIFIED that google-github-actions/auth re-points gcloud/ADC cleanly when used twice).
  preflight:
    needs: refresh
    if: needs.refresh.result == 'success' && needs.refresh.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --quiet "google-cloud-storage>=2.14.0"

      - name: Authenticate as the deployer (Cloud Run read)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Read the serving revision
        run: |
          gcloud run services describe "$SERVICE" --region "$REGION" --project "$GCP_PROJECT" --format=json > service.json
          PREV=$(jq -r '[.status.traffic[] | select((.percent // 0) == 100)] | if length == 1 then .[0].revisionName else empty end' service.json)
          [ -n "$PREV" ] || { echo "::error::cannot identify a single revision serving 100%"; exit 1; }
          gcloud run revisions describe "$PREV" --region "$REGION" --project "$GCP_PROJECT" --format=json > rev-prev.json

      - name: Authenticate as the publisher (bucket read)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.PUBLISHER_SA }}

      - name: Previous revision's pinned build still exists (refuse otherwise)
        run: python scripts/ops/rollout_checks.py preflight --prev-revision-json rev-prev.json --bucket "$BUCKET"

  # deploy.yml in index-rollout mode (workflow_call). The called workflow keeps its own concurrency
  # group (deploy-prod), gates, rollback and template-pin restore; no new rights, same deployer.
  rollout:
    needs: [refresh, preflight]
    if: needs.preflight.result == 'success' && needs.refresh.outputs.build_id != ''
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      index_build_id: ${{ needs.refresh.outputs.build_id }}
    secrets: inherit

  # Retention runs ONLY after a successful rollout (new build serving 100 %, post-shift check
  # passed). It sets customTime; the bucket lifecycle rule deletes 2 days later. Never deletes.
  retain:
    needs: [refresh, rollout]
    if: needs.rollout.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --quiet "google-cloud-storage>=2.14.0"

      - name: Authenticate as the deployer (Cloud Run read)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Collect every revision that can reference a build
        run: |
          gcloud run services describe "$SERVICE" --region "$REGION" --project "$GCP_PROJECT" --format=json > service.json
          gcloud run revisions list --service "$SERVICE" --region "$REGION" --project "$GCP_PROJECT" --format=json > revisions-all.json
          # An empty listing must fail closed: it would otherwise read as "nothing is referenced".
          [ "$(jq 'length' revisions-all.json)" -gt 0 ] || { echo "::error::no revisions listed"; exit 1; }
          mkdir revs
          for NAME in $(jq -r '.[].metadata.name' revisions-all.json); do
            jq --arg n "$NAME" '.[] | select(.metadata.name == $n)' revisions-all.json > "revs/${NAME}.json"
          done

      - name: Authenticate as the publisher (customTime on builds)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.PUBLISHER_SA }}

      - name: Mark builds beyond the 3 newest (never a referenced one) for the lifecycle rule
        run: |
          python scripts/ops/expire_builds.py --bucket "$BUCKET" --service-json service.json \
            --revisions-dir revs --keep 3 --apply

  # Separate job so only IT holds issues: write. Dry runs never alert (a manual rehearsal is not a
  # production event); scheduled and real manual runs do. ANY failed stage alerts.
  alert:
    needs: [refresh, preflight, rollout, retain]
    if: >-
      always() && needs.refresh.result != 'skipped' &&
      !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Update prod-alert issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY_B64: ${{ needs.refresh.outputs.summary_b64 }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          R_REFRESH: ${{ needs.refresh.result }}
          R_PREFLIGHT: ${{ needs.preflight.result }}
          R_ROLLOUT: ${{ needs.rollout.result }}
          R_RETAIN: ${{ needs.retain.result }}
        run: |
          # An empty/garbled summary is fine: refresh_alert.py then alerts with "no summary produced".
          printf '%s' "$SUMMARY_B64" | base64 -d > refresh-summary.json 2>/dev/null || true
          FAILED=""
          for PAIR in "refresh:$R_REFRESH" "preflight:$R_PREFLIGHT" "rollout:$R_ROLLOUT" "retain:$R_RETAIN"; do
            case "${PAIR#*:}" in failure|cancelled) FAILED="${FAILED:+$FAILED,}${PAIR%%:*}" ;; esac
          done
          OUTCOME=success
          if [ -n "$FAILED" ]; then OUTCOME=failure; fi
          python3 scripts/ops/refresh_alert.py --repo "$REPO" --run-url "$RUN_URL" \
            --summary refresh-summary.json --outcome "$OUTCOME" --failed-jobs "$FAILED"
