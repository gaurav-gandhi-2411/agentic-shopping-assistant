# ONE-OFF rehearsal (NOT FOR MERGE): dry-run feed fetch from a GitHub-hosted runner.
# No secrets, no cloud auth, no build, no publish. Runs only when this file or the script changes.
name: rehearsal-fetch

on:
  pull_request:
    paths:
      - ".github/workflows/rehearsal-fetch.yml"
      - "scripts/ops/rehearsal_fetch.py"

permissions:
  contents: read

concurrency:
  group: rehearsal-fetch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Fetch all 38 refreshable public feeds (dry run)
        run: python scripts/ops/rehearsal_fetch.py --out rehearsal_summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rehearsal-summary
          path: rehearsal_summary.json
          if-no-files-found: warn
